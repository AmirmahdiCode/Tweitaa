<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توئیتا</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Kamva';
            src: url('other/kamva.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #ffffff;
            --bg2: #f5f5f5;
            --bg3: #e0e0e0;
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-light: #fdba74;
            --primary-rgb: 249, 115, 22;
            --dark: #1f2937;
            --text: #374151;
            --text-light: #9ca3af;
            --white: #ffffff;
            --card-bg: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --border: 1px solid rgba(0, 0, 0, 0.08);
            --success: #10b981;
            --danger: #ef4444;
            --font: 'Kamva', Tahoma, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --bg2: #1e293b;
            --bg3: #334155;
            --dark: #f8fafc;
            --text: #cbd5e1;
            --text-light: #64748b;
            --card-bg: #1e293b;
            --border: 1px solid rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }
        img { pointer-events: none; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        [data-theme="dark"] .header {
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header-inner {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }
        .header-typo {
            height: 32px;
            object-fit: contain;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: fadeIn 0.4s ease;
        }
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-text {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }
        .loading-subtext {
            font-size: 12px;
            color: var(--text-light);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-state {
            display: none;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }
        .register-state.show { display: flex; }

        .register-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 4px;
        }
        .register-subtitle {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: right;
        }
        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            padding-right: 4px;
        }
        .form-input {
            font-family: var(--font);
            font-size: 14px;
            padding: 12px 16px;
            border: 1.5px solid var(--bg3);
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--primary);
        }
        .form-input::placeholder {
            color: var(--text-light);
            font-size: 12px;
        }
        .form-input.invalid {
            border-color: var(--danger);
        }
        .form-hint {
            font-size: 10.5px;
            color: var(--text-light);
            padding-right: 4px;
            line-height: 1.7;
        }
        .form-hint.error {
            color: var(--danger);
        }

        .input-with-btn {
            display: flex;
            gap: 8px;
        }
        .input-with-btn .form-input {
            flex: 1;
        }
        .upload-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: var(--font);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .upload-btn:active { transform: scale(0.96); }
        .upload-btn i { font-size: 14px; }

        .suggest-follow-section {
            margin-top: 8px;
            text-align: right;
        }
        .suggest-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            padding-right: 4px;
        }
        .suggest-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .suggest-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1.5px solid var(--bg3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .suggest-item.selected {
            border-color: var(--primary);
            background: rgba(249, 115, 22, 0.05);
        }
        .suggest-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-light);
            flex-shrink: 0;
            overflow: hidden;
        }
        .suggest-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .suggest-info {
            flex: 1;
            text-align: right;
        }
        .suggest-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .suggest-name .blue-tick {
            width: 14px;
            height: 14px;
            object-fit: contain;
        }
        .suggest-username {
            font-size: 11px;
            color: var(--text-light);
            direction: ltr;
            text-align: right;
        }
        .suggest-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: transparent;
        }
        .suggest-item.selected .suggest-check {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .settings-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .settings-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            background: var(--card-bg);
            border: 1.5px solid var(--bg3);
            border-radius: 12px;
            font-family: var(--font);
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .settings-btn:active { transform: scale(0.97); }
        .settings-btn i { font-size: 16px; color: var(--primary); }

        .footer {
            position: fixed;
            bottom: 16px;
            left: 5%;
            right: 5%;
            max-width: 460px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--bg3);
            border-radius: 18px;
            padding: 12px 16px;
            z-index: 100;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        [data-theme="dark"] .footer {
            background: rgba(30, 41, 59, 0.7);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .footer-loading {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
        }
        .progress-label { color: var(--text); }
        .progress-percent { color: var(--primary); direction: ltr; }
        .progress-track {
            width: 100%;
            height: 6px;
            background: var(--bg3);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .footer-register { display: none; }
        .footer-register.show { display: block; }
        .footer-loading.hide { display: none; }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: var(--font);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }
        .submit-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(249, 115, 22, 0.3);
        }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .toast-container {
            position: fixed;
            top: 70px;
            left: 5%;
            right: 5%;
            max-width: 400px;
            margin: 0 auto;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: var(--danger);
            color: #fff;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-state {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }
        .error-state.show { display: flex; }
        .error-icon { font-size: 48px; color: var(--danger); }
        .error-title { font-size: 18px; font-weight: 800; color: var(--dark); }
        .error-desc { font-size: 13px; color: var(--text-light); line-height: 1.8; }
    </style>
</head>
<body>

    <div class="bg-animation"></div>
    <div class="toast-container" id="toastContainer"></div>

    <header class="header">
        <div class="header-inner">
            <img src="images/logo.png" alt="توئیتا" class="header-logo">
            <img src="images/nameP.png" alt="توئیتا" class="header-typo">
        </div>
    </header>

    <main class="main-container">
        <div class="loading-state" id="loadingState">
            <div class="loader-spinner"></div>
            <div class="loading-text">در حال آماده‌سازی...</div>
            <div class="loading-subtext">لطفاً چند لحظه صبر کنید</div>
        </div>

        <div class="register-state" id="registerState">
            <h1 class="register-title">خوش آمدی 👋</h1>
            <p class="register-subtitle">برای شروع، پروفایلت رو کامل کن</p>

            <div class="form-group">
                <label class="form-label">نام نمایشی</label>
                <input type="text" class="form-input" id="inputName" placeholder="مثلاً: علی رضایی">
            </div>

            <div class="form-group">
                <label class="form-label">لینک تصویر پروفایل (اختیاری)</label>
                <div class="input-with-btn">
                    <input type="url" class="form-input" id="inputProfile" placeholder="https://cdn.imgurl.ir/uploads/xxxx.png" dir="ltr">
                    <button class="upload-btn" id="btnUploadImg" type="button">
                        <i class="bi bi-cloud-upload"></i>
                        آپلود
                    </button>
                </div>
                <div class="form-hint" id="profileHint">
                    فقط لینک از سایت <a href="javascript:void(0)" id="linkImgurl" style="color:var(--primary);font-weight:700;text-decoration:none;">imgurl.ir</a> با پسوند png / jpg / webp پذیرفته می‌شود.
                    <br>
                    ⚠️ هنگام آپلود، حتماً گزینه‌ی «دائمی» را انتخاب کنید.
                </div>
            </div>

            <div class="suggest-follow-section">
                <div class="suggest-title">پیشنهاد برای دنبال کردن</div>
                <div class="suggest-list" id="suggestList"></div>
            </div>

            <div class="settings-row">
                <button class="settings-btn" id="btnTheme">
                    <i class="bi bi-moon-stars" id="themeIcon"></i>
                    <span id="themeText">حالت تاریک</span>
                </button>
            </div>
        </div>

        <div class="error-state" id="errorState">
            <div class="error-icon"><i class="bi bi-x-circle-fill"></i></div>
            <div class="error-title" id="errorTitle">خطا</div>
            <div class="error-desc" id="errorDesc"></div>
        </div>
    </main>

    <footer class="footer" id="footer">
        <div class="footer-loading" id="footerLoading">
            <div class="progress-info">
                <span class="progress-label" id="progressLabel">در حال بررسی...</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        <div class="footer-register" id="footerRegister">
            <button class="submit-btn" id="submitBtn">ثبت‌نام و ورود به توئیتا</button>
        </div>
    </footer>

    <script>
        (function() {
            'use strict';

            var API_URL = 'https://script.google.com/macros/s/AKfycbxJqL6nxh_fnv31knVhC79GFUg7JDJgm1-nwKPI-39Xt1dbWZ4wOb39XjcYt-yyQ2l_Ow/exec';
            var webApp = window.Eitaa && window.Eitaa.WebApp;

            var IMGURL_REGEX = /^https:\/\/cdn\.imgurl\.ir\/[A-Za-z0-9_\-\.\/]+\.(png|jpg|jpeg|webp)$/i;

            var loadingState = document.getElementById('loadingState');
            var registerState = document.getElementById('registerState');
            var errorState = document.getElementById('errorState');
            var footerLoading = document.getElementById('footerLoading');
            var footerRegister = document.getElementById('footerRegister');
            var progressFill = document.getElementById('progressFill');
            var progressPercent = document.getElementById('progressPercent');
            var progressLabel = document.getElementById('progressLabel');
            var inputName = document.getElementById('inputName');
            var inputProfile = document.getElementById('inputProfile');
            var profileHint = document.getElementById('profileHint');
            var suggestList = document.getElementById('suggestList');
            var submitBtn = document.getElementById('submitBtn');
            var btnTheme = document.getElementById('btnTheme');
            var themeIcon = document.getElementById('themeIcon');
            var themeText = document.getElementById('themeText');

            var currentUser = null;
            var selectedFollows = [];
            var suggestedUsers = [];
            var currentTheme = 'light';

            function setProgress(percent, label) {
                progressFill.style.width = percent + '%';
                progressPercent.textContent = percent + '%';
                if (label) progressLabel.textContent = label;
            }

            function showError(title, desc) {
                loadingState.style.display = 'none';
                registerState.classList.remove('show');
                errorState.classList.add('show');
                document.getElementById('errorTitle').textContent = title;
                document.getElementById('errorDesc').textContent = desc;
                footerLoading.style.display = 'none';
                footerRegister.classList.remove('show');
            }

            function showToast(msg) {
                var container = document.getElementById('toastContainer');
                var toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i><span>' + msg + '</span>';
                container.appendChild(toast);
                setTimeout(function() { toast.remove(); }, 4000);
            }

            function applyTheme(theme) {
                currentTheme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    themeIcon.className = 'bi bi-sun';
                    themeText.textContent = 'حالت روشن';
                } else {
                    themeIcon.className = 'bi bi-moon-stars';
                    themeText.textContent = 'حالت تاریک';
                }
                localStorage.setItem('tweitaa_theme', theme);
            }

            function isValidProfileUrl(url) {
                if (!url) return true;
                return IMGURL_REGEX.test(url);
            }

            function openImgurlSite() {
                if (webApp && webApp.openEitaaLink) {
                    webApp.openEitaaLink('https://imgurl.ir/');
                } else {
                    window.open('https://imgurl.ir/', '_blank', 'noopener,noreferrer');
                }
            }

            function renderSuggestions() {
                suggestList.innerHTML = '';
                if (suggestedUsers.length === 0) {
                    suggestList.innerHTML = '<div style="text-align:center;font-size:12px;color:var(--text-light);padding:10px;">پیشنهادی وجود ندارد</div>';
                    return;
                }
                suggestedUsers.forEach(function(user) {
                    var div = document.createElement('div');
                    div.className = 'suggest-item';
                    div.dataset.id = user.eitaa_id;
                    var avatarContent = user.profile_image
                        ? '<img src="' + user.profile_image + '" alt="">'
                        : '<i class="bi bi-person-fill"></i>';
                    var displayName = user.type === 'channel'
                        ? user.first_name
                        : ((user.first_name || '') + ' ' + (user.last_name || '')).trim() || 'کاربر';
                    var blueTick = user.is_official
                        ? '<img src="images/bluetic.png" class="blue-tick" alt="official">'
                        : '';
                    div.innerHTML =
                        '<div class="suggest-avatar">' + avatarContent + '</div>' +
                        '<div class="suggest-info">' +
                            '<div class="suggest-name">' + displayName + blueTick + '</div>' +
                            '<div class="suggest-username">@' + (user.username || 'user') + '</div>' +
                        '</div>' +
                        '<div class="suggest-check"><i class="bi bi-check-lg"></i></div>';
                    div.addEventListener('click', function() {
                        var id = user.eitaa_id;
                        if (selectedFollows.indexOf(id) > -1) {
                            selectedFollows = selectedFollows.filter(function(x) { return x !== id; });
                            div.classList.remove('selected');
                        } else {
                            selectedFollows.push(id);
                            div.classList.add('selected');
                        }
                    });
                    suggestList.appendChild(div);
                });
            }

            async function apiCall(action, params) {
                try {
                    var payload = { action: action, params: params || {} };
                    var r = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    return await r.json();
                } catch(e) {
                    return { ok: false, error: 'network' };
                }
            }

            async function init() {
                var savedTheme = localStorage.getItem('tweitaa_theme') || 'light';
                applyTheme(savedTheme);

                if (webApp) {
                    try {
                        webApp.ready();
                        webApp.expand();
                        if (webApp.BackButton && webApp.BackButton.hide) webApp.BackButton.hide();
                    } catch(e) {}
                }

                setProgress(10, 'در حال دریافت اطلاعات از ایتا...');

                currentUser = webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user
                    ? webApp.initDataUnsafe.user
                    : null;

                if (!currentUser || !currentUser.id) {
                    showError('ورود از ایتا', 'لطفاً این برنامک را از داخل ایتا باز کنید');
                    return;
                }

                setProgress(40, 'در حال بررسی وضعیت حساب...');

                var checkResult = await apiCall('registerOrLoginUser', {
                    user: {
                        id: currentUser.id,
                        first_name: currentUser.first_name || '',
                        last_name: currentUser.last_name || '',
                        username: currentUser.username || ''
                    }
                });

                if (!checkResult || !checkResult.ok) {
                    showError('خطا در احراز هویت', 'مشکلی در تأیید هویت پیش آمد. لطفاً دوباره تلاش کنید.');
                    return;
                }

                if (checkResult.data && checkResult.data.new_user === false) {
                    setProgress(100, 'در حال ورود...');
                    setTimeout(function() {
                        window.location.href = 'dashboard/index.html';
                    }, 500);
                    return;
                }

                setProgress(60, 'در حال آماده‌سازی پیشنهادها...');

                var suggestResult = await apiCall('getRandomSuggestions', {});
                if (suggestResult && suggestResult.ok && Array.isArray(suggestResult.data)) {
                    suggestedUsers = suggestResult.data;
                }
                renderSuggestions();

                setProgress(100, 'آماده ثبت‌نام');
                loadingState.style.display = 'none';
                registerState.classList.add('show');
                footerLoading.classList.add('hide');
                footerRegister.classList.add('show');

                if (currentUser.first_name) {
                    inputName.value = (currentUser.first_name + ' ' + (currentUser.last_name || '')).trim();
                }
            }

            btnTheme.addEventListener('click', function() {
                applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
            });

            document.getElementById('btnUploadImg').addEventListener('click', openImgurlSite);
            document.getElementById('linkImgurl').addEventListener('click', openImgurlSite);

            inputProfile.addEventListener('input', function() {
                var v = inputProfile.value.trim();
                if (!v) {
                    inputProfile.classList.remove('invalid');
                    profileHint.classList.remove('error');
                    profileHint.innerHTML = 'فقط لینک از سایت <a href="javascript:void(0)" id="linkImgurl" style="color:var(--primary);font-weight:700;text-decoration:none;">imgurl.ir</a> با پسوند png / jpg / webp پذیرفته می‌شود.<br>⚠️ هنگام آپلود، حتماً گزینه‌ی «دائمی» را انتخاب کنید.';
                    document.getElementById('linkImgurl').addEventListener('click', openImgurlSite);
                    return;
                }
                if (!isValidProfileUrl(v)) {
                    inputProfile.classList.add('invalid');
                    profileHint.classList.add('error');
                    profileHint.textContent = 'لینک نامعتبر است. باید با https://cdn.imgurl.ir/ شروع و به png/jpg/webp ختم شود.';
                } else {
                    inputProfile.classList.remove('invalid');
                    profileHint.classList.remove('error');
                    profileHint.innerHTML = '✓ لینک معتبر است.';
                }
            });

            submitBtn.addEventListener('click', async function() {
                var name = inputName.value.trim();
                if (!name) {
                    showToast('لطفاً نام نمایشی خود را وارد کنید');
                    return;
                }

                var profileUrl = inputProfile.value.trim();
                if (profileUrl && !isValidProfileUrl(profileUrl)) {
                    showToast('لینک تصویر پروفایل نامعتبر است');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'در حال ثبت‌نام...';

                var updateResult = await apiCall('updateUserProfile', {
                    eitaa_id: currentUser.id,
                    first_name: name,
                    profile_image: profileUrl || undefined
                });

                if (!updateResult || !updateResult.ok) {
                    showToast('خطا در ثبت‌نام. دوباره تلاش کنید.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'ثبت‌نام و ورود به توئیتا';
                    return;
                }

                for (var i = 0; i < selectedFollows.length; i++) {
                    await apiCall('toggleFollow', {
                        eitaa_id: currentUser.id,
                        target_id: selectedFollows[i]
                    });
                }

                setProgress(100, 'در حال ورود...');
                setTimeout(function() {
                    window.location.href = 'dashboard/index.html';
                }, 500);
            });

            init();
        })();
    </script>
</body>
</html>
